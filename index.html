
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>آلة حاسبة شوشو</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn {
      transition: all 0.2s ease-in-out;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    input:disabled {
      background-color: #fdf2f8;
    }
  </style>
</head>
<body class="bg-pink-50 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-xl rounded-2xl p-6 w-80 sm:w-96 text-center">
    <h1 class="text-3xl font-bold text-pink-500 mb-4">آلة حاسبة شوشو</h1>
    <input 
      type="text" 
      id="display" 
      class="w-full text-2xl p-3 rounded-xl mb-4 text-right border border-pink-300 focus:outline-none" 
      disabled 
    />
    
    <div class="grid grid-cols-4 gap-3">
      <!-- الصف 1 -->
      <button class="btn bg-pink-100 rounded-xl p-3 text-xl" onclick="clearDisplay()">C</button>
      <button class="btn bg-pink-100 rounded-xl p-3 text-xl" onclick="deleteLast()">⌫</button>
      <button class="btn bg-pink-100 rounded-xl p-3 text-xl" onclick="appendValue('/')">÷</button>
      <button class="btn bg-pink-200 rounded-xl p-3 text-xl" onclick="appendValue('*')">×</button>
      
      <!-- الصف 2 -->
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('7')">7</button>
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('8')">8</button>
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('9')">9</button>
      <button class="btn bg-pink-200 rounded-xl p-3 text-xl" onclick="appendValue('-')">-</button>
      
      <!-- الصف 3 -->
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('4')">4</button>
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('5')">5</button>
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('6')">6</button>
      <button class="btn bg-pink-200 rounded-xl p-3 text-xl" onclick="appendValue('+')">+</button>
      
      <!-- الصف 4 -->
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('1')">1</button>
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('2')">2</button>
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('3')">3</button>
      <button class="btn bg-pink-300 rounded-xl p-3 text-xl row-span-2" onclick="calculate()">=</button>
      
      <!-- الصف 5 -->
      <button class="btn col-span-2 bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('0')">0</button>
      <button class="btn bg-pink-50 rounded-xl p-3 text-xl" onclick="appendValue('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function appendValue(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = "";
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch (e) {
        display.value = "حدث خطأ";
      }
    }
  </script>
</body>
</html>
